<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HORSE RACE — Ставки</title>
<link rel="manifest" href="./manifest.json">
<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px 15px;
  min-height: 100vh;
  background: #17251d;
  color: #ffffff;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  color: #75e68a;
  font-size: 28px;
}

.info {
  display: flex;
  justify-content: space-around;
  gap: 10px;
  margin: 25px auto;
  max-width: 500px;
  font-size: 18px;
}

.info strong {
  color: #75e68a;
  font-size: 25px;
}

#horseChoices {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  max-width: 450px;
  margin: 20px auto;
}

.horseButton {
  min-height: 65px;
  border: 2px solid #75e68a;
  border-radius: 10px;
  background: #344b3b;
  color: white;
  font-size: 22px;
  font-weight: bold;
}

.horseButton.selected {
  background: #258b45;
  border-color: white;
}

.horseButton:disabled {
  opacity: 0.35;
  background: #555;
  border-color: #888;
}

#betButton {
  width: 100%;
  max-width: 450px;
  min-height: 60px;
  margin: 15px auto;
  border: 0;
  border-radius: 10px;
  background: #258b45;
  color: white;
  font-size: 22px;
  font-weight: bold;
}

#betButton:disabled {
  opacity: 0.4;
}

#result {
  margin: 20px 0;
  color: #75e68a;
  font-size: 20px;
  font-weight: bold;
}

#qrBox {
  margin: 20px auto;
  padding: 15px;
  width: fit-content;
  max-width: 100%;
  background: white;
  border-radius: 12px;
}

#qrCode {
  width: 240px;
  max-width: 100%;
}

#qrHint {
  color: #222;
  font-size: 14px;
  margin-top: 10px;
}

.actionBar {
  display: flex;
  gap: 8px;
  width: 100%;
  max-width: 500px;
  margin: 25px auto 0;
}

.actionButton {
  flex: 1;
  min-width: 0;
  min-height: 58px;
  padding: 5px 2px;
  border: 1px solid #75e68a;
  border-radius: 10px;
  background: #258b45;
  color: white;
  font-size: 13px;
  font-weight: bold;
  text-decoration: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
}

.actionButton:disabled {
  opacity: 0.35;
}

.actionButton .printerIcon {
  font-size: 22px;
}

#backButton {
  background: transparent;
  line-height: normal;
} 
#printArea {
  display: none;
}

@media print {

  @page {
    size: 58mm auto;
    margin: 0;
  }

  body {
    margin: 0;
    padding: 0;
    background: white;
    color: black;
    display: block;
  }

  body > * {
    display: none !important;
  }

  #printArea {
    display: block !important;
    width: 58mm;
    background: white;
    color: black;
  }

  .printTicket {
    width: 58mm;
    padding: 3mm;
    text-align: center;
    font-family: Arial, sans-serif;
    page-break-after: always;
    break-after: page;
  }

  .printTicket:last-child {
    page-break-after: auto;
    break-after: auto;
  }

  .printLogo {
    width: 18mm;
    height: 18mm;
    object-fit: contain;
  }

  .printQR {
    width: 30mm;
    height: 30mm;
  }
}  
</style>
</head>

<body>

<h1>HORSE RACE</h1>
<h2>ПРИЁМ СТАВОК</h2>

<div class="info">
  <div>
    ЗАЕЗД<br>
    № <strong id="raceNumber">1</strong>
  </div>

  <div>
    ДОРОЖЕК<br>
    <strong id="laneCount">2</strong>
  </div>
</div>

<div id="result">Выберите лошадь</div>

<div id="horseChoices"></div>

<button id="betButton" disabled>
  ПРИНЯТЬ СТАВКУ
</button>

<div id="qrBox" hidden>
  <div id="qrCode"></div>
  <div id="qrHint">
    Покажите QR-код участнику
  </div>
</div>
  
<div class="actionBar">
<button
id="printLastButton"
class="actionButton"
disabled
>
<span class="printerIcon">🖨️</span>
ПОСЛЕДНИЙ
</button>
<button
id="printAllButton"
class="actionButton"
disabled
>
<span class="printerIcon">🖨️</span>
ВСЕ БИЛЕТЫ
</button>
<a
id="backButton"
class="actionButton"
href="./index.html"
>
<span class="printerIcon">↩</span>
К ИГРЕ
</a>
</div> 
<div id="printArea"></div>  
<script src="./qrcode.min.js"></script>
<script>
// Получаем данные текущего заезда

let raceNumber =
  Number(localStorage.getItem("raceNumber")) || 1;

let laneCount =
  Number(localStorage.getItem("laneCount")) || 2;

let selectedHorses = [];

try {
  selectedHorses =
    JSON.parse(localStorage.getItem("selectedHorses")) || [];
} catch {
  selectedHorses = [];
}

const savedBetsRace =
  Number(localStorage.getItem("betsRaceNumber"));

if (savedBetsRace !== raceNumber) {
  selectedHorses = [];

  localStorage.setItem("betsRaceNumber", raceNumber);
  localStorage.setItem("selectedHorses", JSON.stringify([]));
  localStorage.setItem("stakeCount", 0);
}

let selectedHorse = null;

// Элементы страницы

const raceElement = document.getElementById("raceNumber");
const laneElement = document.getElementById("laneCount");
const resultElement = document.getElementById("result");
const horseChoices = document.getElementById("horseChoices");
const betButton = document.getElementById("betButton");
const qrBox = document.getElementById("qrBox");
const qrCode = document.getElementById("qrCode");
  
const printArea = document.getElementById("printArea");
const printLastButton = document.getElementById("printLastButton");
const printAllButton = document.getElementById("printAllButton");

// Билеты текущего заезда
let printTickets = [];

try {
  printTickets = JSON.parse(
    localStorage.getItem("printTickets")
  ) || [];
} catch {
  printTickets = [];
}

// Проверяем, что билеты относятся к текущему заезду
if (Number(localStorage.getItem("printTicketsRace")) !== raceNumber) {
  printTickets = [];
  localStorage.setItem("printTicketsRace", raceNumber);
  localStorage.setItem("printTickets", JSON.stringify([]));
}

function updatePrintButtons() {
  const hasTickets = printTickets.length > 0;

  printLastButton.disabled = !hasTickets;
  printAllButton.disabled = !hasTickets;
}

updatePrintButtons();  

// Отображение исходных данных

raceElement.textContent = raceNumber;
laneElement.textContent = laneCount;


// Создание кнопок выбора лошадей

function drawHorseChoices() {

  horseChoices.innerHTML = "";

  for (let i = 1; i <= laneCount; i++) {

    const button = document.createElement("button");

    button.className = "horseButton";
    button.textContent = "№ " + i;

    

    if (selectedHorse === i) {
      button.classList.add("selected");
    }

    button.addEventListener("click", () => {

      selectedHorse = i;

      resultElement.textContent =
        "Выбрана лошадь № " + i;

      betButton.disabled = false;

      drawHorseChoices();
    });

    horseChoices.appendChild(button);
  }

  
}
// Создание QR-кода для печатного билета

function createTicketQR(race, horse) {
const ticketURL =
new URL("ticket.html", window.location.href).href +
"?race=" + race +
"&horse=" + horse;

const qr = qrcode(0, "M");
qr.addData(ticketURL);
qr.make();

return qr.createDataURL(6, 4);
}

// Подготовка билетов к печати

function preparePrint(tickets) {
printArea.innerHTML = "";

tickets.forEach(ticket => {
const qrImage = createTicketQR(
ticket.race,
ticket.horse
);

const ticketElement = document.createElement("div");
ticketElement.className = "printTicket";

ticketElement.innerHTML = `
  <img
    class="printLogo"
    src="./horse-frames/icon-180.png"
    alt="HORSE RACE"
  >

  <h2>HORSE RACE</h2>

  <p>ЗАЕЗД № ${ticket.race}</p>

  <h2>ЛОШАДЬ № ${ticket.horse}</h2>

  <img
    class="printQR"
    src="${qrImage}"
    alt="QR-код билета"
  >
`;

printArea.appendChild(ticketElement);
});

setTimeout(() => {
window.print();
}, 300);
}

// Печать последнего билета

printLastButton.addEventListener("click", () => {
if (printTickets.length === 0) return;

preparePrint([
printTickets[printTickets.length - 1]
]);
});

// Печать всех билетов

printAllButton.addEventListener("click", () => {
if (printTickets.length === 0) return;

preparePrint(printTickets);
});

// Регистрация ставки

function registerStake() {

  if (selectedHorse === null) {
    resultElement.textContent = "Сначала выберите лошадь";
    return;
  }

 // Сохраняем ставку

  selectedHorses.push(selectedHorse);

  localStorage.setItem(
    "selectedHorses",
    JSON.stringify(selectedHorses)
  );

  localStorage.setItem(
    "stakeCount",
    selectedHorses.length
  );

  resultElement.textContent =
    "ПРИНЯТА СТАВКА НА ЛОШАДЬ № " + selectedHorse;

  // Формируем ссылку на билет

  const ticketURL =
    new URL("ticket.html", window.location.href).href +
    "?race=" + raceNumber +
    "&horse=" + selectedHorse;

  // Создаём QR-код

  const qrImageURL =
    "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=" +
    encodeURIComponent(ticketURL);

  qrCode.innerHTML = "";

  const img = document.createElement("img");

  img.src = qrImageURL;
  img.alt = "QR-код билета";
  img.width = 240;
  img.height = 240;

  qrCode.appendChild(img);

  qrBox.hidden = false;

  // Сбрасываем выбор и обновляем свободные места

  selectedHorse = null;

  drawHorseChoices();
}


// Кнопка регистрации

betButton.addEventListener("click", registerStake);


// Первоначальное отображение

drawHorseChoices();

</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker
      .register("./service-worker.js")
      .then(registration => {
        console.log(
          "HORSE RACE: Service Worker зарегистрирован",
          registration.scope
        );
      })
      .catch(error => {
        console.error(
          "Ошибка регистрации Service Worker:",
          error
        );
      });
  });
}
</script>
</body>
</html>
