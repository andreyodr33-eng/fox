<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HORSE RACE — Билет</title>
<link rel="manifest" href="./manifest.json">
<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 25px 15px;
  background: #17251d;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

h2 {
  color: #75e68a;
  margin: 0 0 20px;
}

canvas {
  width: 100%;
  max-width: 450px;
  height: auto;
  border-radius: 12px;
}

button {
  width: 100%;
  max-width: 450px;
  min-height: 58px;
  margin-top: 22px;
  border: 0;
  border-radius: 10px;
  background: #258b45;
  color: white;
  font-size: 20px;
  font-weight: bold;
}

button:active {
  background: #176b32;
}

#message {
  margin-top: 15px;
  color: #b9d9c0;
  text-align: center;
}
</style>
</head>

<body>

<h2>ВАШ БИЛЕТ</h2>

<canvas id="ticket" width="900" height="560"></canvas>

<button id="saveButton">СОХРАНИТЬ БИЛЕТ</button>

<div id="message"></div>
<script src="qrcode.min.js"></script>
<script>
const logo = new Image();

const params = new URLSearchParams(location.search);

const race = Number(params.get("race"));
const horse = Number(params.get("horse"));

const canvas = document.getElementById("ticket");
const ctx = canvas.getContext("2d");

const message = document.getElementById("message");
const saveButton = document.getElementById("saveButton");
logo.src = "./horse-frames/icon-180.png";
if (
!Number.isInteger(race) || race < 1 ||
!Number.isInteger(horse) || horse < 1
) {
message.textContent = "Ошибка: номер билета не указан.";
saveButton.disabled = true;
} else {
logo.onload = () => {  
drawTicket();
};
logo.onerror = () => { 
  message.textContent = "Не удалось загрузить логотип.";
 };
logo.src = "./horse-frames/icon-180.png";
}
function drawTicket() {

saveButton.disabled = true;

// Фон билета
ctx.fillStyle = "#14251b";
ctx.fillRect(0, 0, 900, 560);

// Рамка
ctx.strokeStyle = "#75e68a";
ctx.lineWidth = 8;
ctx.strokeRect(15, 15, 870, 530);

// Название игры
// Логотип лисички
ctx.drawImage(logo, 40, 42, 85, 85);

// Название игры
ctx.fillStyle = "#75e68a";
ctx.textAlign = "center";
ctx.font = "bold 65px Arial";
ctx.fillText("HORSE RACE", 450, 135);

// Заголовок
ctx.fillStyle = "#ffffff";
ctx.font = "bold 48px Arial";
ctx.fillText("БИЛЕТ УЧАСТНИКА", 450, 210);

// Разделительная линия
ctx.strokeStyle = "#75e68a";
ctx.lineWidth = 3;
ctx.beginPath();
ctx.moveTo(100, 250);
ctx.lineTo(800, 250);
ctx.stroke();

// Номер заезда
ctx.textAlign = "left";
ctx.fillStyle = "#ffffff";
ctx.font = "bold 40px Arial";
ctx.fillText("ЗАЕЗД №", 100, 345);

ctx.textAlign = "right";
ctx.fillStyle = "#75e68a";
ctx.font = "bold 65px Arial";
ctx.fillText(String(race), 590, 345);

// Номер лошади
ctx.textAlign = "left";
ctx.fillStyle = "#ffffff";
ctx.font = "bold 40px Arial";
ctx.fillText("ЛОШАДЬ №", 100, 445);

ctx.textAlign = "right";
ctx.fillStyle = "#75e68a";
ctx.font = "bold 75px Arial";
ctx.fillText(String(horse), 590, 445);

// Нижняя надпись
ctx.textAlign = "center";
ctx.fillStyle = "#b9d9c0";
ctx.font = "25px Arial";
ctx.fillText(
"СОХРАНИТЕ БИЛЕТ ДО ОКОНЧАНИЯ ЗАЕЗДА",
450,
520
);

// Локальная генерация QR-кода
try {
const qr = qrcode(0, "M");

qr.addData(location.href);
qr.make();

const qrImage = new Image();

qrImage.onload = () => {

  // Белое поле
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(650, 275, 210, 210);

  // QR-код
  ctx.drawImage(qrImage, 665, 290, 180, 180);

  saveButton.disabled = false;
  message.textContent = "";
};

qrImage.onerror = () => {
  message.textContent = "Ошибка создания QR-кода.";
};

qrImage.src = qr.createDataURL(6, 4);
} catch (error) {
message.textContent = "Не удалось создать QR-код.";
console.error(error);
}
}
// Преобразование билета в PNG
function makeImage() {
return new Promise((resolve, reject) => {
canvas.toBlob(blob => {
if (blob) resolve(blob);
else reject(new Error("Не удалось создать изображение"));
}, "image/png");
});
}

// Сохранение билета
saveButton.addEventListener("click", async () => {
try {
const blob = await makeImage();

const url = URL.createObjectURL(blob);
const link = document.createElement("a");

link.href = url;
link.download = `HORSE-RACE-${race}-${horse}.png`;

document.body.appendChild(link);
link.click();
link.remove();

setTimeout(() => URL.revokeObjectURL(url), 10000);

message.textContent = "Билет сохранён.";
} catch (error) {
message.textContent = "Не удалось сохранить билет.";
console.error(error);
}
});
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker
      .register("./service-worker.js")
      .then(registration => {
        console.log(
          "HORSE RACE: Service Worker зарегистрирован",
          registration.scope
        );
      })
      .catch(error => {
        console.error(
          "Ошибка регистрации Service Worker:",
          error
        );
      });
  });
}
</script>
</body>
</html>
